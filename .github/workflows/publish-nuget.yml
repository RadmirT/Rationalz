name: Publish NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore Rationalz.sln

      - name: Build
        run: dotnet build Rationalz.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Rationalz.UnitTests/Rationalz.UnitTests.csproj --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/Rationalz/Rationalz.csproj --configuration Release --no-build --output ./artifacts

      - name: Publish to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
