name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore Rationalz.sln

      - name: Build
        run: dotnet build Rationalz.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Rationalz.UnitTests/Rationalz.UnitTests.csproj --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/Rationalz/Rationalz.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: rationalz-nuget
          path: ./artifacts/*.nupkg
          if-no-files-found: error
